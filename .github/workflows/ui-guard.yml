name: UI Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, master]

jobs:
  wireframe-check:
    name: Wireframe + adversarial contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check UI changes have wireframes
        env:
          UI_GUARD_STRICT: "1"
          UI_GUARD_BASE: "origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}"
        run: |
          if [ -x scripts/check-ui-guard.sh ]; then
            bash scripts/check-ui-guard.sh
          elif [ -x hooks/pre-commit-ui-guard.sh ]; then
            bash hooks/pre-commit-ui-guard.sh
          else
            echo "No UI Guard checker found — skip"
          fi
