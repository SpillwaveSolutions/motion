name: ci

# The gate that actually tests the application.
#
# Until this existed, the only workflow in this repo was worklog-invariants,
# which validates work-log JSONL and never installs Bun or Rust -- a PR deleting
# src/App.tsx passed green. This is the authoritative gate; the git pre-commit
# hook only runs a fast subset and can be bypassed with --no-verify.
#
# NOTE: adding this file does not block merges by itself. Branch protection must
# be configured to require the `verify` and `rust` checks.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, guards, unit, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Rejects any `Bun.` use reachable from src/main.tsx. Static on purpose:
      # the E2E suite only sees code it executes, so dormant browser-unsafe code
      # (the four enrichment modules) would stay green until it was wired up.
      - name: Guard the client bundle
        run: bun run guard:client

      - name: Unit tests
        run: bun test src

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: E2E
        run: bunx playwright test

      - name: Production build
        run: bun run build

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  rust:
    name: cargo test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Tauri's Linux build needs these; without them the crate will not compile
      # on a bare runner even though it builds fine on macOS.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The workspace jail lives in src-tauri/src/fs_core.rs, and this also runs
      # tests/contract/storage-cases.json against it -- the same fixture bun test
      # runs against the TypeScript core, so the two cannot drift apart.
      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --lib

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
